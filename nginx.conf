server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json image/svg+xml;

    # Cache static assets — no-cache (pas no-store) : le navigateur garde le
    # fichier mais revalide systématiquement auprès du serveur (ETag), qui
    # répond 304 si rien n'a changé. Coût quasi nul, mais garantit qu'un
    # déploiement est visible immédiatement sans jouer avec des query strings
    # de version. "immutable" était trop agressif : plus aucune revérification
    # pendant 7 jours, même sur un reload manuel.
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|webm|mp4)$ {
        add_header Cache-Control "no-cache";
    }

    # Main location
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
